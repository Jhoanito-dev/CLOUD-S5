services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cloud_postgres
    environment:
      POSTGRES_USER: clouduser
      POSTGRES_PASSWORD: cloudpass
      POSTGRES_DB: roadworks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cloud_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouduser -d roadworks"]
      interval: 5s
      timeout: 5s
      retries: 10

  # TileServer for offline maps (optionnel - nécessite antananarivo.mbtiles)
  tileserver:
    image: maptiler/tileserver-gl:latest
    container_name: cloud_tileserver
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    command: --config /data/config.json
    networks:
      - cloud_network
    restart: on-failure

  # Backend API Node.js
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud_backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://clouduser:cloudpass@postgres:5432/roadworks
      TILESERVER_URL: http://tileserver:8080
      JWT_SECRET: cloud-s5-p17-jwt-secret-key-2024
      MAX_LOGIN_ATTEMPTS: 3
      SESSION_DURATION: 3600
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
      FIREBASE_PROJECT_ID: cloud-antananarivo
      FIREBASE_CLIENT_EMAIL: firebase-adminsdk-fbsvc@cloud-antananarivo.iam.gserviceaccount.com
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    networks:
      - cloud_network
    restart: on-failure

  # Frontend React (Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloud_frontend
    environment:
      API_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - cloud_network
    restart: on-failure

volumes:
  postgres_data:

networks:
  cloud_network:
    driver: bridge
